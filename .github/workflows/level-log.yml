name: Update level-up log

# Rebuilds assets/log.json (home page "Level-up log") from the git history of
# assets/data.js, so each rank / tier shows the date and time it was reached.
on:
  push:
    branches: [main]
    paths:
      - assets/data.js
      - tools/build-log.js
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: level-log
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build log
        run: node tools/build-log.js
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/log.json; then echo "log.json unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/log.json
          git commit -m "Update level-up log"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
