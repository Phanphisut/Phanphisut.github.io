<head>

<body data-page="home">
<header id="hero"></header>

<main id="main" tabindex="-1">
  <section aria-labelledby="npc-name">
    <div class="wrap">
      <div class="npc">
        <div class="portrait slot">
          <img id="face" src="images/profile.jpg" alt="Phanphisut Phumet" width="96" height="96">
        </div>
        <div class="dialog panel">
          <span class="name" id="npc-name">Phanphisut</span>
          <p data-i18n="bio"></p>
          <span class="more" aria-hidden="true">▼</span>
        </div>
      </div>
    </div>
  </section>

  <section id="character" aria-labelledby="stats-h">
    <div class="wrap">
      <div class="sec-label panel">
        <img class="pix" data-sprite="hero" alt="" style="width:16px;height:32px">
        <div><small>Character · Stats</small><h2 id="stats-h" data-i18n="stats.title"></h2></div>
      </div>
      <div class="charsheet panel">
        <div class="stats-col">
          <div class="char-name"><strong>PHANPHISUT PHUMET</strong><span data-i18n="stats.class"></span></div>
          <div class="rank slot" id="rank"></div>
          <div class="stats" id="stats"></div>
          <p class="stats-rule" data-i18n="stats.rule"></p>
        </div>
        <div class="char-col">
          <div class="char-screen"><canvas id="char-cv" width="768" height="576" aria-label="Pixel character"></canvas></div>
          <div class="char-row" aria-live="polite"><span id="char-now"></span><span id="char-cd"></span></div>
        </div>
      </div>
    </div>
  </section>

  <section id="phad" aria-labelledby="phad-h">
    <div class="wrap">
      <div class="sec-label panel">
        <img class="pix" data-sprite="chest" alt="">
        <div><small>Side quest · Game</small><h2 id="phad-h" data-i18n="phad.title"></h2></div>
      </div>
      <div class="phadcard panel">
        <a class="phad-shot slot" href="phad-company.html">
          <img src="images/phad-company.png" width="768" height="432" alt="ออฟฟิศพิกเซลในเกม PHAD Company" loading="lazy">
        </a>
        <div class="phad-info">
          <strong class="phad-name">PHAD COMPANY</strong>
          <p data-i18n="phad.desc"></p>
          <a class="btn btn-play" href="phad-company.html" data-i18n="phad.play"></a>
          <p class="phad-note" data-i18n="phad.note"></p>
        </div>
      </div>
    </div>
  </section>

  <section id="terminal" aria-labelledby="term-h">
    <div class="wrap">
      <div class="sec-label panel">
        <img class="pix" data-sprite="term" alt="">
        <div><small>Terminal · tty1</small><h2 id="term-h">Terminal</h2></div>
      </div>
      <div class="term" id="term">
        <div class="term-bar"><i></i><i></i><i></i><span>phanphisut@portfolio: ~</span></div>
        <div class="term-out" id="term-out" role="log" aria-live="polite"></div>
        <label class="term-line"><span class="pr">phanphisut@portfolio:~$</span><input id="term-in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal command"></label>
        <div class="term-keys">
          <button class="btn" type="button" data-cmd="help">help</button>
          <button class="btn" type="button" data-cmd="about">about</button>
          <button class="btn" type="button" data-cmd="skills">skills</button>
          <button class="btn" type="button" data-cmd="projects">projects</button>
          <button class="btn" type="button" data-cmd="contact">contact</button>
          <button class="btn" type="button" data-cmd="drone">drone</button>
          <button class="btn" type="button" data-cmd="weather">weather</button>
        </div>
      </div>
    </div>
  </section>

  <section id="contact" aria-labelledby="contact-h">
    <div class="wrap">
      <div class="sec-label panel">
        <img class="pix" data-sprite="bubble" alt="">
        <div><small>Inventory · Contact</small><h2 id="contact-h" data-i18n="contact.title"></h2></div>
      </div>
      <div class="inventory panel">
        <p class="inv-title">Inventory</p>
        <ul class="inv-grid">
          <li><div class="inv slot">
            <img class="pix" data-sprite="line" alt="">
            <strong>LINE</strong><small id="line-val">0653057699</small>
            <span class="row">
              <button class="btn" type="button" id="copy-line" data-copy="0653057699" data-i18n="copy"></button>
              <a class="btn" href="https://line.me/ti/p/~0653057699" target="_blank" rel="noopener" data-i18n="open"></a>
            </span>
          </div></li>
          <li><a class="inv slot" href="https://www.facebook.com/pha.xr.2025" target="_blank" rel="noopener">
            <img class="pix" data-sprite="fb" alt=""><strong>Facebook</strong><small>Pha Xr</small>
          </a></li>
          <li><a class="inv slot" href="https://www.instagram.com/_phaxr/" target="_blank" rel="noopener">
            <img class="pix" data-sprite="ig" alt=""><strong>Instagram</strong><small>Pha Xr</small>
          </a></li>
          <li><a class="inv slot" href="https://github.com/Phanphisut?tab=repositories" target="_blank" rel="noopener">
            <img class="pix" data-sprite="term" alt=""><strong>GitHub</strong><small>Phanphisut</small>
          </a></li>
        </ul>
        <p class="inv-hint" data-i18n="contact.hint"></p>
      </div>
    </div>
  </section>
</main>

<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script src="assets/fun.js"></script>
<script src="assets/fx.js"></script>
<script src="assets/term.js"></script>
<script src="assets/character.js"></script>
</body>
</html>
