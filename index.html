  <nav aria-labelledby="signs-h">
    <section>
      <div class="wrap">
        <div class="sec-label panel">
          <img class="pix" data-sprite="tree" alt="">

        </div>
        <div class="signs">
          <a class="sign panel" href="projects.html">

            <span class="slot"><img class="pix" data-sprite="medal" alt=""></span>
            <span><strong data-i18n="nav.certs"></strong><small data-i18n="signs.certs"></small><span class="count" data-count="certificates"></span></span>
            <span class="arrow" aria-hidden="true">▶</span>
          </a>
        </div>
      </div>
    </section>
  </nav>

      <div class="sec-label panel">
        <img class="pix" data-sprite="bubble" alt="">
        <div><small>Inventory · Contact</small><h2 id="contact-h" data-i18n="contact.title"></h2></div>
      </div>
      <div class="inventory panel">
        <p class="inv-title">Inventory</p>

          <li><div class="inv slot">
            <img class="pix" data-sprite="line" alt="">

              <button class="btn" type="button" id="copy-line" data-copy="0653057699" data-i18n="copy"></button>

            </span>
          </div></li>
          <li><a class="inv slot" href="https://www.facebook.com/Phaxr" target="_blank" rel="noopener">

          <li><a class="inv slot" href="https://www.instagram.com/Phaxr" target="_blank" rel="noopener">

          <li><a class="inv slot" href="https://github.com/Phanphisut?tab=repositories" target="_blank" rel="noopener">
